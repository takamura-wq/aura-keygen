<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA KEYGEN | Generator Kunci VIP</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Plus Jakarta Sans', 'sans-serif'], 
                        mono: ['JetBrains Mono', 'monospace'] 
                    },
                    colors: { 
                        cyber: { 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', dark: '#050508' } 
                    },
                    animation: { 
                        'fade-up': 'fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        fadeUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pulseGlow: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '.5' } }
                    }
                }
            }
        }
    </script>

    <style>
        /* Menggunakan tema Aura Portal */
        body { background-color: #030305; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        .bg-ambient { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 60%); z-index: -2; pointer-events: none; }
        .bg-grid { position: fixed; inset: 0; background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); z-index: -3; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }

        .glass-panel { background: rgba(10, 10, 14, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(168, 85, 247, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        
        /* Toast Animation */
        @keyframes slideUp { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes fadeOut { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, 10px); opacity: 0; } }
        .toast-enter { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-leave { animation: fadeOut 0.3s ease-out forwards; }
        
        /* Custom Scrollbar for results */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }
        
        /* Modal Styles untuk Scanner */
        .modal-overlay { position: fixed; inset: 0; background: rgba(3, 3, 5, 0.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { transform: scale(0.95); opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); max-height: 90vh; display: flex; flex-direction: column; }
        .modal-overlay.active .modal-content { transform: scale(1); opacity: 1; }
        
        .premium-input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 12px 14px; width: 100%; border-radius: 10px; font-family: 'JetBrains Mono', monospace; outline: none; transition: all 0.3s; resize: none; }
        .premium-input:focus { border-color: #a855f7; background: rgba(168, 85, 247, 0.05); }
    </style>
</head>

<body class="flex justify-center items-center p-4">
    <!-- Background Elements -->
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>

    <!-- Main Container -->
    <div class="w-full max-w-[380px] glass-panel rounded-3xl p-6 sm:p-8 flex flex-col gap-6 relative z-10 animate-fade-up">
        
        <!-- Header -->
        <div class="text-center flex flex-col items-center gap-2">
            <div class="w-12 h-12 rounded-xl bg-cyber-500/10 border border-cyber-500/30 flex items-center justify-center text-cyber-400 mb-2 shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                <i class="fas fa-key text-xl"></i>
            </div>
            <h1 class="font-extrabold text-white text-xl tracking-tight leading-none">AURA KEYGEN</h1>
            <span class="text-[10px] text-slate-400 font-medium tracking-widest uppercase bg-white/5 px-3 py-1 rounded-full border border-white/5">VIP Video Generator</span>
        </div>

        <!-- Result Display -->
        <div class="relative group mt-4">
            <div class="absolute inset-0 bg-cyber-500/20 blur-xl rounded-2xl animate-pulse-glow z-0 pointer-events-none"></div>
            <!-- Diubah agar bisa di-scroll jika isinya banyak (min height ditetapkan, max-height 200px) -->
            <div class="relative z-10 bg-black/60 border border-cyber-500/40 rounded-2xl p-6 flex flex-col items-center justify-center min-h-[120px] max-h-[220px] overflow-y-auto shadow-inner">
                <span id="result" class="text-5xl font-mono font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-cyber-400 tracking-[0.2em] ml-[0.1em] text-center whitespace-pre-line">
                    ----
                </span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-3 mt-2">
            <!-- Grid untuk 1 Kunci dan 10 Kunci -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="generateKey(1)" class="w-full py-3.5 bg-gradient-to-r from-cyber-600 to-cyber-400 hover:brightness-110 text-white rounded-xl text-xs font-bold shadow-[0_0_15px_rgba(168,85,247,0.4)] transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                    <i class="fas fa-key"></i>
                    <span>1 KUNCI</span>
                </button>
                
                <button onclick="generateKey(10)" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-blue-400 hover:brightness-110 text-white rounded-xl text-xs font-bold shadow-[0_0_15px_rgba(59,130,246,0.4)] transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                    <i class="fas fa-layer-group"></i>
                    <span>10 KUNCI</span>
                </button>
            </div>

            <button onclick="copyToClipboard()" id="copyBtn" class="w-full py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2 active:scale-[0.98] mt-1">
                <i class="fas fa-copy text-cyber-400"></i>
                <span>SALIN HASIL</span>
            </button>
            
            <button onclick="openScanner()" class="w-full py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <i class="fas fa-radar text-cyber-400"></i>
                <span>SCAN KEY DUPLIKAT</span>
            </button>
        </div>
        
    </div>

    <!-- Scanner Modal -->
    <div id="scanner-modal" class="modal-overlay">
        <div class="modal-content glass-panel p-6 rounded-3xl w-full max-w-[380px] border-t-2 border-t-cyber-500 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-white text-base flex items-center gap-2">
                    <i class="fas fa-radar text-cyber-400 animate-pulse"></i> Scanner Duplikat
                </h3>
                <button onclick="closeScanner()" class="text-slate-400 hover:text-white transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <p class="text-[10px] text-slate-400 mb-3 bg-white/5 p-2 rounded-lg border border-white/10">
                <i class="fas fa-info-circle text-cyber-400"></i> Paste/Tempel daftar key Anda di bawah ini untuk mengecek apakah ada key yang kembar:
            </p>
            
            <textarea id="scanner-input" rows="5" class="premium-input text-sm mb-4 tracking-widest" placeholder="ABCD&#10;EFGH&#10;IJKL..."></textarea>
            
            <button onclick="runScan()" class="w-full py-3.5 bg-gradient-to-r from-cyber-600 to-cyber-400 text-white rounded-xl text-xs font-bold shadow-[0_0_15px_rgba(168,85,247,0.4)] hover:brightness-110 transition-all mb-4 active:scale-[0.98] flex justify-center items-center gap-2">
                <i class="fas fa-search"></i> MULAI SCAN
            </button>

            <div id="scanner-result" class="hidden flex-col gap-2 overflow-y-auto max-h-[160px] pr-1">
                <!-- Hasil scan muncul di sini -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-8 left-1/2 z-50 pointer-events-none w-max"></div>

    <script>
        const resultEl = document.getElementById('result');
        const copyBtn = document.getElementById('copyBtn');
        const toastContainer = document.getElementById('toastContainer');

        // Fungsi generate tunggal (4 huruf kapital)
        function generateSingleKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let key = '';
            for (let i = 0; i < 4; i++) {
                key += getRandomChar(chars);
            }
            return key;
        }

        // Logic utama untuk generate berdasarkan jumlah (1 atau 10)
        function generateKey(count = 1) {
            let resultText = '';
            
            if (count === 1) {
                resultText = generateSingleKey();
                // Kembalikan ukuran teks menjadi besar untuk 1 kunci
                resultEl.className = "text-5xl font-mono font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-cyber-400 tracking-[0.2em] ml-[0.1em] text-center whitespace-pre-line";
            } else {
                let keys = [];
                for (let i = 0; i < count; i++) {
                    keys.push(generateSingleKey());
                }
                resultText = keys.join('\n');
                // Ubah ukuran teks menjadi lebih kecil agar 10 kunci terlihat rapi
                resultEl.className = "text-2xl font-mono font-bold text-transparent bg-clip-text bg-gradient-to-b from-white to-cyber-400 tracking-[0.3em] ml-[0.15em] text-center whitespace-pre-line leading-loose";
            }
            
            // Visual effect on change
            resultEl.style.opacity = '0';
            setTimeout(() => {
                resultEl.textContent = resultText;
                resultEl.style.opacity = '1';
                resultEl.style.transition = 'opacity 0.2s';
            }, 100);
        }

        function getRandomChar(str) {
            const cryptoObj = window.crypto || window.msCrypto; 
            if (cryptoObj && cryptoObj.getRandomValues) {
                const randomArray = new Uint32Array(1);
                cryptoObj.getRandomValues(randomArray);
                return str[randomArray[0] % str.length];
            }
            return str[Math.floor(Math.random() * str.length)];
        }

        // Copy to Clipboard logic
        function copyToClipboard() {
            const textToCopy = resultEl.textContent.trim();
            if (!textToCopy || textToCopy === '----') return;

            // Gunakan API modern jika memungkinkan
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    handleCopySuccess();
                }).catch(err => {
                    fallbackCopyTextToClipboard(textToCopy);
                });
            } else {
                fallbackCopyTextToClipboard(textToCopy);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    handleCopySuccess();
                } else {
                    showToast("Gagal menyalin!", "error");
                }
            } catch (err) {
                showToast("Sistem tidak mendukung salin otomatis.", "error");
            }
            document.body.removeChild(textArea);
        }

        function handleCopySuccess() {
            // Cek apakah itu 1 atau 10 kunci yang disalin untuk notif
            const isMultiple = resultEl.textContent.includes('\n');
            const toastMsg = isMultiple ? '10 Kunci disalin!' : `Kunci "${resultEl.textContent.trim()}" disalin!`;

            // Animasi Tombol
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = `<i class="fas fa-check text-green-400"></i><span class="text-green-400">TERSALIN!</span>`;
            copyBtn.classList.add('border-green-400/50', 'bg-green-400/10');
            
            showToast(toastMsg);

            setTimeout(() => {
                copyBtn.innerHTML = originalHTML;
                copyBtn.classList.remove('border-green-400/50', 'bg-green-400/10');
            }, 2000);
        }

        function showToast(message, type = "success") {
            const toast = document.createElement('div');
            
            // Styling sesuai tema cyber
            toast.className = `bg-cyber-dark border ${type === "success" ? "border-cyber-500 text-cyber-400" : "border-red-500 text-red-400"} px-5 py-3 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] font-bold text-xs tracking-wide flex items-center gap-3 toast-enter mb-2 backdrop-blur-md`;
            
            let icon = type === "success" 
                ? `<i class="fas fa-check-circle text-base"></i>`
                : `<i class="fas fa-exclamation-circle text-base"></i>`;
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
                setTimeout(() => toast.remove(), 300); 
            }, 2500);
        }

        // Generate 1 kunci pertama saat halaman dimuat
        window.onload = () => generateKey(1);

        // --- FITUR SCANNER DUPLIKAT ---
        function openScanner() {
            document.getElementById('scanner-modal').classList.add('active');
            document.getElementById('scanner-input').value = '';
            
            const resultDiv = document.getElementById('scanner-result');
            resultDiv.classList.add('hidden');
            resultDiv.classList.remove('flex');
            resultDiv.innerHTML = '';
        }

        function closeScanner() {
            document.getElementById('scanner-modal').classList.remove('active');
        }

        function runScan() {
            const input = document.getElementById('scanner-input').value;
            const resultDiv = document.getElementById('scanner-result');
            
            resultDiv.innerHTML = '';
            resultDiv.classList.remove('hidden');
            resultDiv.classList.add('flex');

            if (!input.trim()) {
                resultDiv.innerHTML = '<div class="text-xs text-red-400 p-3 bg-red-400/10 rounded-xl border border-red-400/20 text-center font-bold">Data kosong! Masukkan key terlebih dahulu.</div>';
                return;
            }

            // Pisahkan input berdasarkan baris (enter), spasi, atau koma
            const rawTokens = input.split(/[\s,]+/).filter(k => k.trim() !== '');
            
            // Bersihkan dari nomor urut (contoh: "1.", "2.", "31.")
            const keys = [];
            rawTokens.forEach(token => {
                const cleaned = token.replace(/^\d+\.?/g, '').trim();
                if (cleaned !== '') {
                    keys.push(cleaned);
                }
            });
            
            if (keys.length === 0) {
                resultDiv.innerHTML = '<div class="text-xs text-red-400 p-3 bg-red-400/10 rounded-xl border border-red-400/20 text-center font-bold">Tidak ada format key yang valid.</div>';
                return;
            }

            const counts = {};
            const duplicates = {};

            // Hitung kemunculan setiap key
            keys.forEach((key, index) => {
                const k = key.toUpperCase();
                if (counts[k]) {
                    counts[k].push(index + 1); // Simpan urutan posisinya
                    duplicates[k] = counts[k];
                } else {
                    counts[k] = [index + 1];
                }
            });

            const duplicateKeys = Object.keys(duplicates);

            if (duplicateKeys.length === 0) {
                resultDiv.innerHTML = `
                    <div class="text-xs text-green-400 p-4 bg-green-400/10 rounded-xl border border-green-400/20 text-center font-bold flex flex-col items-center gap-2">
                        <i class="fas fa-check-circle text-3xl mb-1"></i>
                        <span>AMAN! Tidak ada key kembar dari total ${keys.length} key.</span>
                    </div>`;
            } else {
                let html = `
                    <div class="text-xs text-red-400 p-3 bg-red-400/10 rounded-xl border border-red-400/20 mb-1 font-bold flex items-center gap-2">
                        <i class="fas fa-exclamation-triangle text-base"></i> 
                        Bahaya! Ditemukan ${duplicateKeys.length} key duplikat:
                    </div>`;
                
                duplicateKeys.forEach(key => {
                    const lines = duplicates[key].join(', ');
                    html += `
                    <div class="flex justify-between items-center bg-black/40 p-2.5 rounded-xl border border-white/5">
                        <span class="font-mono text-cyber-400 font-bold tracking-widest text-sm">${key}</span>
                        <span class="text-[9px] text-slate-400 bg-white/5 px-2 py-1 rounded-md">Urutan data: ${lines}</span>
                    </div>`;
                });
                resultDiv.innerHTML = html;
            }
        }
    </script>
</body>
</html>
